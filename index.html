<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>movie-dna</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Movie suggestions based on shared DNA — cast, tone, and narrative dynamics — not thumbs up/down." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 512 512%22><rect width=%22512%22 height=%22512%22 rx=%2296%22 fill=%22%230a0a0a%22/><g stroke-linecap=%22round%22 fill=%22none%22 transform=%22translate(256,256) scale(0.72) translate(-256,-256)%22><path d=%22M 186 50 C 246 130, 246 130, 186 210 C 126 290, 126 290, 186 370 C 226 423, 226 423, 256 462%22 stroke=%22%23e72a31%22 stroke-width=%2226%22/><path d=%22M 326 50 C 266 130, 266 130, 326 210 C 386 290, 386 290, 326 370 C 286 423, 286 423, 256 462%22 stroke=%22%2301b4b4%22 stroke-width=%2226%22/></g></svg>" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="movie-dna" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>movie-dna</h1>
    <p class="tagline">Start with one thing you like.<br />See what shares its DNA.</p>
  </header>

  <main>
    <section class="catalog-panel" aria-label="Catalog selection">
      <div class="catalog-toggle" role="radiogroup" aria-label="Movie catalog">
        <button type="button" id="catalog-main-btn" class="catalog-btn" role="radio" aria-checked="true">My Catalog</button>
        <button type="button" id="catalog-artiflix-btn" class="catalog-btn" role="radio" aria-checked="false">Artiflix Classics</button>
      </div>
      <p id="catalog-note" class="catalog-note"></p>
    </section>

    <section class="seed-panel" aria-label="Search inputs">
      <label for="seed-input">Add a movie, actor, director, or a plot dynamic — separate several with commas</label>
      <div class="seed-input-row">
        <input
          id="seed-input"
          type="text"
          placeholder="Movie, actor, or vibe… (comma-separate for several)"
          autocomplete="off"
        />
        <button id="add-seed-btn" type="button">Add</button>
      </div>
      <p id="seed-error" class="seed-error" role="alert"></p>
      <ul id="seed-chips" class="seed-chips"></ul>
    </section>

    <section class="controls-panel" aria-label="Result tuning">
      <label for="temperature-slider" class="temperature-label">
        <span>Focused</span>
        <input id="temperature-slider" type="range" min="0" max="100" value="35" />
        <span>Adventurous</span>
      </label>
    </section>

    <section class="action-panel">
      <button id="search-btn" type="button" class="primary-btn" title="Press again anytime for a fresh set of suggestions">
        Get suggestions
      </button>
    </section>

    <section class="results-panel" aria-label="Suggestions">
      <p id="results-status" class="results-status"></p>
      <div id="results-grid" class="results-grid"></div>
    </section>
  </main>

  <dialog id="explain-dialog" class="explain-dialog">
    <h2 id="explain-title"></h2>
    <div id="explain-body" class="explain-body"></div>
    <form method="dialog">
      <button type="submit" class="dialog-close">Close</button>
    </form>
  </dialog>

  <dialog id="disambiguate-dialog" class="explain-dialog">
    <h2 id="disambiguate-title"></h2>
    <p>Which one did you mean?</p>
    <ul id="disambiguate-list" class="disambiguate-list"></ul>
    <form method="dialog">
      <button type="submit" class="dialog-close">Cancel</button>
    </form>
  </dialog>

  <footer class="app-footer">movie-dna <span id="app-version"></span></footer>

  <script src="version.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    document.getElementById('app-version').textContent = 'v' + self.APP_VERSION;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {
          // Installability/offline support is a progressive enhancement —
          // the app works fully without it if registration fails.
        });
      });
    }
  </script>
</body>
</html>
