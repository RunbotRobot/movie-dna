<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>movie-dna</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Movie suggestions based on shared DNA — cast, tone, and narrative dynamics — not thumbs up/down." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="movie-dna" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>movie-dna</h1>
    <p class="tagline">Start with one thing you like.<br />See what shares its DNA.</p>
  </header>

  <main>
    <section class="seed-panel" aria-label="Search inputs">
      <label for="seed-input">Add a movie, actor, director, or a plot dynamic</label>
      <div class="seed-input-row">
        <input
          id="seed-input"
          type="text"
          placeholder="Movie, actor, or vibe…"
          autocomplete="off"
        />
        <button id="add-seed-btn" type="button">Add</button>
      </div>
      <p id="seed-error" class="seed-error" role="alert"></p>
      <ul id="seed-chips" class="seed-chips"></ul>
    </section>

    <section class="controls-panel" aria-label="Result tuning">
      <label for="temperature-slider" class="temperature-label">
        <span>Focused</span>
        <input id="temperature-slider" type="range" min="0" max="100" value="35" />
        <span>Adventurous</span>
      </label>
    </section>

    <section class="action-panel">
      <button id="search-btn" type="button" class="primary-btn" title="Press again anytime for a fresh set of suggestions">
        Get suggestions
      </button>
    </section>

    <section class="results-panel" aria-label="Suggestions">
      <p id="results-status" class="results-status"></p>
      <div id="results-grid" class="results-grid"></div>
    </section>
  </main>

  <dialog id="explain-dialog" class="explain-dialog">
    <h2 id="explain-title"></h2>
    <div id="explain-body" class="explain-body"></div>
    <form method="dialog">
      <button type="submit" class="dialog-close">Close</button>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {
          // Installability/offline support is a progressive enhancement —
          // the app works fully without it if registration fails.
        });
      });
    }
  </script>
</body>
</html>
